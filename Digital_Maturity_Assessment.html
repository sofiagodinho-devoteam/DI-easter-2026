function calculateResults(answers){
  const results={};
  for(const[dn,cfg]of Object.entries(WEIGHTS)){
    const qw=cfg.questions.map(qid=>answers[qid]??-1);
    if(qw.some(w=>w<0)){results[dn]=null;continue;}
    const ss=cfg.subDimensions.map((_,si)=>{let s=0;for(let qi=0;qi<cfg.questions.length;qi++)s+=qw[qi]*cfg.matrix[qi][si];return s;});
    results[dn]={subDimensions:cfg.subDimensions.map((name,i)=>({name,score:ss[i],level:toLevel(ss[i])})),average:toLevel(ss.reduce((a,b)=>a+b,0)/ss.length)};
  }
  return results;
}

function RadarChart({results,asis}){
  const allS=Object.entries(results).filter(([,r])=>r).flatMap(([,r])=>r.subDimensions);
  const n=allS.length;if(n<3)return null;
  const cx=360,cy=360,maxR=120;
  const getP=(i,v)=>{const a=(Math.PI*2*i)/n-Math.PI/2;const r=(v/5)*maxR;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};};
  const pts=allS.map((s,i)=>getP(i,s.level));
  const pathD=pts.map((p,i)=>(i===0?"M":"L")+" "+p.x+" "+p.y).join(" ")+" Z";
  const wrap=(t,mx)=>{if(t.length<=mx)return[t];const w=t.split(" ");const ls=[];let c="";for(const x of w){if(c&&(c+" "+x).length>mx){ls.push(c);c=x;}else c=c?c+" "+x:x;}if(c)ls.push(c);return ls;};
  return h("svg",{viewBox:"0 0 720 720",style:{width:"100%",maxWidth:680,overflow:"visible"}},
    ...[1,2,3,4,5].map(ring=>{const rp=Array.from({length:n},(_,i)=>getP(i,ring));return h("path",{key:"r"+ring,d:rp.map((p,i)=>(i===0?"M":"L")+" "+p.x+" "+p.y).join(" ")+" Z",fill:"none",stroke:"#e0e0e0",strokeWidth:.8});}),
    ...allS.map((_,i)=>{const p=getP(i,5);return h("line",{key:"a"+i,x1:cx,y1:cy,x2:p.x,y2:p.y,stroke:"#e8e8e8",strokeWidth:.6});}),
    asis&&asis.allSubs&&asis.allSubs.length>=3?(function(){var ap=asis.allSubs.map(function(s,i){return getP(i,s.level);});var ad=ap.map(function(p,i){return(i===0?"M":"L")+" "+p.x+" "+p.y;}).join(" ")+" Z";return h("path",{key:"asis-poly",d:ad,fill:"rgba(0,0,0,.06)",stroke:"#aaa",strokeWidth:1.5,strokeDasharray:"4,3"});})():null,
    h("path",{key:"poly",d:pathD,fill:"rgba(248,72,94,.12)",stroke:"#F8485E",strokeWidth:2.5}),
    ...(asis&&asis.allSubs?asis.allSubs.map(function(s,i){var p=getP(i,s.level);return h("circle",{key:"ap"+i,cx:p.x,cy:p.y,r:3.5,fill:"#bbb",stroke:"#fff",strokeWidth:1.5})}):[]),
    ...pts.map((p,i)=>h("circle",{key:"p"+i,cx:p.x,cy:p.y,r:5,fill:"#434343",stroke:"#fff",strokeWidth:2})),
    ...allS.flatMap((s,i)=>{
      const lr=maxR+80;const a=(Math.PI*2*i)/n-Math.PI/2;
      const lx=cx+lr*Math.cos(a);const ly=cy+lr*Math.sin(a);
      const isR=lx>cx+5;const isL=lx<cx-5;const isCx=!isR&&!isL;
      const lines=wrap(s.name,16);const lH=11;const tH=lines.length*lH;
      const isB=ly>cy+5;const oY=isB?tH/2:ly<cy-5?-tH/2:0;
      const bx=isCx?lx-57:isR?lx-4:lx-118;
      return[
        h("rect",{key:"bg"+i,x:bx,y:ly-tH/2+oY-4,width:94,height:tH+8,rx:5,fill:"white",stroke:"#ddd",strokeWidth:.7}),
        h("circle",{key:"cd"+i,cx:bx+6,cy:ly+oY,r:3.5,fill:gc(s.level)}),
        ...lines.map((ln,li)=>h("text",{key:"t"+i+"-"+li,x:bx+14,y:ly+oY-tH/2+(li+1)*lH-2,fontSize:8.5,fill:"#444",fontWeight:500,fontFamily:"Montserrat,sans-serif"},ln))
      ];
    }),
    ...[1,2,3,4,5].map(r=>h("text",{key:"n"+r,x:getP(0,r).x+4,y:getP(0,r).y-4,fontSize:7.5,fill:"#bbb"},r))
  );
}
